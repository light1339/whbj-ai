<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统登录 - 安全守卫</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin-bottom: 24px;
            color: #1a1a1a;
            text-align: center;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a4a4a;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #409eff;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover { background: #66b1ff; }
        .error-msg {
            color: #f56c6c;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>系统安全登录</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" required placeholder="请输入 admin">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="login-btn">登 录</button>
        <div id="errorBox" class="error-msg"></div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById('errorBox');
        errorBox.style.display = 'none';

        // 🚀 使用标准 OAuth2 要求的 FormData 格式发送登录请求
        const formData = new FormData();
        formData.append('username', document.getElementById('username').value);
        formData.append('password', document.getElementById('password').value);

        try {
            const response = await fetch('/api/v1/login/token', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                // 🎉 登录成功，把令牌和用户信息塞进 localStorage 缓存里
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('username', data.user_info.username);
                localStorage.setItem('role', data.user_info.role);
                localStorage.setItem('kb_access', JSON.stringify(data.user_info.kb_access||['default']));
                
                // ✈️ 成功后跳转到聊天主页
                window.location.href = '/';
            } else {
                // ❌ 登录失败，显示后端传过来的错误详情
                errorBox.innerText = data.detail || '登录失败，请检查账号密码';
                errorBox.style.display = 'block';
            }
        } catch (err) {
            errorBox.innerText = '服务器连接异常，请检查后端服务';
            errorBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
